name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Run tests
        run: |
          output=$(luajit tests/run.lua 2>&1) || {
            echo "::error::$output"
            exit 1
          }
          echo "$output"
